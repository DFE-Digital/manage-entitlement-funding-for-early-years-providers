name: Terraform Deploy
run-name: Development deployment (${{ github.ref_name }})

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compile Bicep
        working-directory: .
        run: az bicep build --file infrastructure/bicep/main.bicep --stdout > /dev/null

      - name: Check infrastructure scripts
        working-directory: .
        run: bash -n infrastructure/scripts/manage-storage-access.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.15.8' }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init (validation only)
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        run: terraform validate

  deploy:
    name: Deploy to development
    needs: validate
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tf-azure-deployment.yml
    with:
      operation: deploy
      deployment: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
      source-ref: ${{ github.sha }}
    secrets: inherit
