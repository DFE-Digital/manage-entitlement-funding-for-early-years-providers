run-name: "Terraform - ${{ github.event_name == 'push' && 'development' || 'validation' }} (${{ github.ref_name }})"
name: 'Terraform Deploy'

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/tf-azure-deploy.yml'

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event_name == 'push' && 'development' || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile Bicep
        working-directory: .
        run: az bicep build --file infrastructure/bicep/main.bicep --stdout > /dev/null

      - name: Check storage access script
        working-directory: .
        run: bash -n infrastructure/scripts/manage-storage-access.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.15.8' }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init (validation only)
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform:
    name: Deploy development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./infrastructure/terraform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_IN_AUTOMATION: true
      DEPLOY_ENVIRONMENT: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Azure Login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Workflow Service Principal Object ID
        id: get-sp-id
        run: |
          SP_OBJECT_ID=$(az ad sp show --id "$ARM_CLIENT_ID" --query id -o tsv)
          test -n "$SP_OBJECT_ID" || { echo "::error::Workflow service principal was not found."; exit 1; }
          echo "object_id=$SP_OBJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Bootstrap Terraform
        id: bootstrap-tf
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: uksouth
          template: ./infrastructure/bicep/main.bicep
          deploymentName: terraform-${{ env.DEPLOY_ENVIRONMENT }}
          parameters: ./infrastructure/bicep/environments/${{ env.DEPLOY_ENVIRONMENT }}.params.json workflowPrincipalId=${{ steps.get-sp-id.outputs.object_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.15.8' }}
          terraform_wrapper: false

      - name: Get runner public IP
        id: runner-ip
        run: |
          WORKER_IP=$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)
          echo "address=$WORKER_IP" >> "$GITHUB_OUTPUT"

      - name: Unlock Terraform State
        id: unlock-state
        working-directory: ./infrastructure
        env:
          ACC_NAME: ${{ steps.bootstrap-tf.outputs.storageAccountName }}
          RG_NAME: ${{ steps.bootstrap-tf.outputs.resourceGroupName }}
          WORKER_IP: ${{ steps.runner-ip.outputs.address }}
        run: bash scripts/manage-storage-access.sh "$ACC_NAME" "$RG_NAME" true "$WORKER_IP"

      - name: Terraform Init
        env:
          ACC_NAME: ${{ steps.bootstrap-tf.outputs.storageAccountName }}
          RG_NAME: ${{ steps.bootstrap-tf.outputs.resourceGroupName }}
        run: |
          terraform init -input=false -upgrade \
            -backend-config="resource_group_name=$RG_NAME" \
            -backend-config="storage_account_name=$ACC_NAME" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=terraform.tfstate"

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=main.tfplan -var-file="environments/$DEPLOY_ENVIRONMENT.tfvars"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve main.tfplan

      - name: Lock Terraform State
        if: ${{ always() && steps.unlock-state.outcome != 'skipped' && steps.bootstrap-tf.outcome == 'success' && steps.runner-ip.outcome == 'success' }}
        working-directory: ./infrastructure
        env:
          ACC_NAME: ${{ steps.bootstrap-tf.outputs.storageAccountName }}
          RG_NAME: ${{ steps.bootstrap-tf.outputs.resourceGroupName }}
          WORKER_IP: ${{ steps.runner-ip.outputs.address }}
        run: bash scripts/manage-storage-access.sh "$ACC_NAME" "$RG_NAME" false "$WORKER_IP"
