name: Code PR Check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: ["main", "release/**", "fix/**"]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10
  URL: "http://127.0.0.1:5000"

jobs:
  trivy-scan:
    name: Trivy Security Scan
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/run-trivy-scan.yml

  build-app:
    name: Build, check and run tests
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build web app
        uses: ./.github/actions/build-dotnet-app
        with:
          dotnet_version: ${{ env.DOTNET_VERSION }}

      - name: Lint YAML
        run: just lint-yaml

      - name: Check formatting
        run: dotnet format Dfe.ManageEntitlementFunding.slnx --verify-no-changes --no-restore

      - name: Run unit tests
        uses: ./.github/actions/run-unit-tests
