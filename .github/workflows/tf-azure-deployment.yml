name: Terraform Deployment

on:
  workflow_call:
    inputs:
      operation:
        description: deploy or destroy
        required: true
        type: string
      deployment:
        required: true
        type: string
      source-ref:
        required: true
        type: string
permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-development
  cancel-in-progress: false
  queue: max

jobs:
  terraform:
    name: ${{ inputs.operation }} ${{ inputs.deployment }}
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: ./infrastructure/terraform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_IN_AUTOMATION: true
      DEPLOY_ENVIRONMENT: development
      DEPLOYMENT: ${{ inputs.deployment }}
      TF_VAR_deployment: ${{ inputs.deployment }}
      TF_VAR_development_basic_auth_password: ${{ secrets.DEVELOPMENT_BASIC_AUTH_PASSWORD }}

    steps:
      - name: Check development access password
        working-directory: .
        run: |
          if [ "${#TF_VAR_development_basic_auth_password}" -lt 32 ] || [[ "$TF_VAR_development_basic_auth_password" =~ ^[[:space:]]*$ ]]; then
            echo "::error::Set DEVELOPMENT_BASIC_AUTH_PASSWORD to a generated password of at least 32 characters in the development GitHub environment."
            exit 1
          fi

      - name: Checkout deployment configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false

      - name: Azure Login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Workflow Service Principal Object ID
        id: get-sp-id
        working-directory: .
        run: |
          SP_OBJECT_ID=$(az ad sp show --id "$ARM_CLIENT_ID" --query id -o tsv)
          test -n "$SP_OBJECT_ID" || { echo "::error::Workflow service principal was not found."; exit 1; }
          echo "object_id=$SP_OBJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Bootstrap shared development backend
        id: bootstrap-tf
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: uksouth
          template: ./infrastructure/bicep/main.bicep
          deploymentName: terraform-${{ env.DEPLOY_ENVIRONMENT }}
          parameters: ./infrastructure/bicep/environments/${{ env.DEPLOY_ENVIRONMENT }}.params.json workflowPrincipalId=${{ steps.get-sp-id.outputs.object_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false

      - name: Get runner public IP
        id: runner-ip
        working-directory: .
        run: |
          WORKER_IP=$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)
          echo "address=$WORKER_IP" >> "$GITHUB_OUTPUT"

      - name: Open backend network access
        id: unlock-state
        working-directory: ./infrastructure
        env:
          ACC_NAME: ${{ steps.bootstrap-tf.outputs.storageAccountName }}
          RG_NAME: ${{ steps.bootstrap-tf.outputs.resourceGroupName }}
          WORKER_IP: ${{ steps.runner-ip.outputs.address }}
        run: bash scripts/manage-storage-access.sh "$ACC_NAME" "$RG_NAME" true "$WORKER_IP"

      - name: Terraform Init
        env:
          ACC_NAME: ${{ steps.bootstrap-tf.outputs.storageAccountName }}
          RG_NAME: ${{ steps.bootstrap-tf.outputs.resourceGroupName }}
        run: |
          STATE_KEY="deployments/$DEPLOYMENT.tfstate"
          if [ "$DEPLOYMENT" = main ]; then STATE_KEY=terraform.tfstate; fi

          for attempt in {1..3}; do
            echo "Terraform init attempt $attempt/3..."
            if terraform init -input=false -no-color -upgrade \
              -backend-config="resource_group_name=$RG_NAME" \
              -backend-config="storage_account_name=$ACC_NAME" \
              -backend-config="container_name=tfstate" \
              -backend-config="key=$STATE_KEY"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Terraform init failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Terraform init failed; retrying in 30 seconds to allow backend access changes to propagate."
            sleep 30
          done

      - name: Terraform Plan
        env:
          TF_VAR_resource_group_name: ${{ steps.bootstrap-tf.outputs.resourceGroupName }}-app-${{ env.DEPLOYMENT }}
          OPERATION: ${{ inputs.operation }}
        run: |
          PLAN_OPTIONS=()
          if [ "$OPERATION" = destroy ]; then PLAN_OPTIONS+=(-destroy); fi
          terraform plan "${PLAN_OPTIONS[@]}" -input=false -no-color \
            -out=main.tfplan -var-file="environments/$DEPLOY_ENVIRONMENT.tfvars"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve main.tfplan

      - name: Setup .NET
        if: ${{ inputs.operation == 'deploy' }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish and deploy apps
        if: ${{ inputs.operation == 'deploy' }}
        working-directory: .
        env:
          TF_DIR: infrastructure/terraform
        run: |
          RG_NAME=$(terraform -chdir="$TF_DIR" output -raw resource_group_name)
          API_APP=$(terraform -chdir="$TF_DIR" output -raw api_app_name)
          WEB_APP=$(terraform -chdir="$TF_DIR" output -raw web_app_name)

          for project in Api:"$API_APP" Web:"$WEB_APP"; do
            name=${project%%:*}
            app=${project#*:}
            dotnet publish "src/Dfe.ManageEntitlementFunding.$name" -c Release -o "publish/$name"
            (cd "publish/$name" && zip -qr "../$name.zip" .)
            az webapp deploy --resource-group "$RG_NAME" --name "$app" \
              --src-path "publish/$name.zip" --type zip
          done

          echo "Web URL: $(terraform -chdir="$TF_DIR" output -raw web_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Close backend network access
        if: ${{ always() && steps.unlock-state.outcome != 'skipped' && steps.bootstrap-tf.outcome == 'success' && steps.runner-ip.outcome == 'success' }}
        working-directory: ./infrastructure
        env:
          ACC_NAME: ${{ steps.bootstrap-tf.outputs.storageAccountName }}
          RG_NAME: ${{ steps.bootstrap-tf.outputs.resourceGroupName }}
          WORKER_IP: ${{ steps.runner-ip.outputs.address }}
        run: bash scripts/manage-storage-access.sh "$ACC_NAME" "$RG_NAME" false "$WORKER_IP"
