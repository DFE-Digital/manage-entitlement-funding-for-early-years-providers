services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/manage-entitlement-funding-for-early-years-providers:cached
    command: sleep infinity
    environment:
      ConnectionStrings__Funding: "Server=db;Database=Funding;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .devcontainer/.env};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db-init:
        condition: service_completed_successfully

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .devcontainer/.env}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" > /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SQLCMDPASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .devcontainer/.env}"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /opt/mssql-tools18/bin/sqlcmd
    command:
      - -S
      - db
      - -U
      - sa
      - -C
      - -b
      - -Q
      - "IF DB_ID(N'Funding') IS NULL CREATE DATABASE [Funding];"

volumes:
  sql-data:
